services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: oilgroup-web
    ports:
      - "6004:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    init: true
    stdin_open: true
    # No TTY: Angular CLI 20 loops on its progress spinner when the TTY has no size.

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: oilgroup-api
    ports:
      - "6006:5000"
    environment:
      PORT: 5000
      ROOT: /local/oilgroup
      ENVIRONMENT: Local
      HOST_DB: db
      USER_DB: oilgroup
      PASS_DB: ${MYSQL_PASSWORD:-oilgroup_dev_password}
      NAME_DB: oilgroup
      SECRETJWT: ${SECRETJWT:-development-only-change-me}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    init: true
    stdin_open: true
    tty: true

  db:
    image: mysql:8.0
    container_name: oilgroup-db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "3006:3306"
    environment:
      MYSQL_DATABASE: oilgroup
      MYSQL_USER: oilgroup
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oilgroup_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oilgroup_root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      # Local development data: loaded only when the database is first created.
      - ./docker/mysql/seed/001-local-development.sql:/docker-entrypoint-initdb.d/002-local-development.sql:ro
      - ./docker/mysql/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
