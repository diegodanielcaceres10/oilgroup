<div class="title">
    <div class="title__info">
        <h2>Pago</h2>
    </div>
    <div *ngIf="!createMode && payment.status == 'Aprobado'" class="group">
        <div class="group__box group__box-icon">
            <div (click)="cancelProviderPaymentDialogConfirm()" class="group__tool group__tool-cancel"><i class="fas fa-trash"></i><span>Cancelar</span></div>
        </div>
    </div>
</div>
<div *ngIf="!createMode" class="section__info">
    <div class="section__box">
        <div class="card">
            <div class="card__content">
                <div class="card__item">
                    <div class="card__box card__box-primary">
                        <div class="card__info">
                            <div class="card__label">Pago:</div>
                            <div class="card__title"><strong>{{ payment.provider.fantasy_name }}</strong></div>
                            <div class="card__title"><strong>{{ payment.import | currency:"CAD":"symbol-narrow":"1.2" }}</strong></div>
                        </div>
                        <div class="card__info">
                            <div class="card__label">Fecha:</div>
                            <div class="card__subtitle"><i class="fas fa-calendar-alt"></i>{{ payment.datetime | date:"dd/MM/yyyy, HH:mm" }}</div>
                            <div class="card__label">Estado:</div>
                            <div class="card__subtitle">
                                <i *ngIf="payment.status == 'Aprobado'" class="fas fa-check"></i>
                                <i *ngIf="payment.status == 'Cancelado'" class="fas fa-times"></i>
                                {{ payment.status }}
                            </div>
                        </div>
                    </div>
                    <div class="card__box card__box-full">
                        <div class="card__info">
                            <div class="card__legend">
                                <span>N° de comprobante</span>
                                <span>{{ payment.ticket }}</span>
                            </div>
                            <div class="card__legend">
                                <span>Medio de pago</span>
                                <span>{{ payment.method }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="createMode" class="section__info">
    <div class="section__box">
        <app-form *ngIf="form && form.buttons" [form]="form" (submitData)="sendForm($event)"></app-form>
    </div>
</div>
<app-dialog-modal *ngFor="let dialog of dialogs" [dialog]="dialog" (responseDialogModal)="responseDialog($event)"></app-dialog-modal>
