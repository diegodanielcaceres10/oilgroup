<div class="header">
    <div class="header__container">
        <div class="header__info">
            <i class="fas fa-user"></i>
            <div class="header__user">
                <strong>{{ access.lastname }}</strong> {{ access.firstname }}
            </div>
        </div>
        <span *ngIf="environment" [ngClass]="{ 'environment-dev' : environment == 'DEV', 'environment-qua' : environment == 'QUA', 'environment-hom' : environment == 'HOM' }" class="environment"><strong>Ambiente</strong>: {{ environment }}</span>
        <a (click)="show = !show" class="header__icon click">
            <i class="fas fa-bell"></i>
        </a>
        <a (click)="logout()" class="header__icon click">
            <i class="fas fa-power-off"></i>
        </a>
        <ul *ngIf="show" class="header__alerts">
            <div class="header__box scrollbar-custom">
                <div class="list">
                    <div *ngFor="let item of alerts" class="list__row">
                        <div class="list__cell">
                            <i *ngIf="item.type == 'success'" class="fas fa-check-circle"></i>
                            <i *ngIf="item.type == 'error'" class="fas fa-times-circle"></i>
                        </div>
                        <div class="list__cell list__cell-full">
                            <div class="list__message">
                                <strong>{{ item.text }}</strong>
                            </div>
                        </div>
                        <div class="list__cell list__cell-right">
                            <div class="list__subtitle">
                                <span>{{ item.time }}</span>
                            </div>
                        </div>
                    </div>
                    <div *ngIf="alerts.length == 0" class="list__row">
                        <div class="list__cell list__cell-full"><i class="fas fa-exclamation-circle"></i>No hay mensajes</div>
                    </div>
                </div>
            </div>
        </ul>
        <div class="header__alert">
            <div [@alert] *ngIf="alert.text" class="header__box header__box-{{ alert.type }} scrollbar-custom">
                <i *ngIf="alert.type == 'error'" class="fas fa-times-circle"></i>
                <i *ngIf="alert.type == 'success'" class="fas fa-times-circle"></i>
                <strong>{{ alert.text }}</strong>
            </div>
        </div>
    </div>
</div>
