<nav class="nav">
    <div class="nav__logo">
        <img src="./assets/img/logo.png" alt="logo">
    </div>
    <div class="nav__list scrollbar-custom">
        <ul class="nav__box">
            <li *ngFor="let item of items" class="nav__item">
                <a *ngIf="(!item.access || item.access.indexOf(access.role) > -1) && item.link" (click)="redirect(item.link, item.name)" [ngClass]="{ 'nav__link-active' : menuselected == item.name }" class="nav__link">
                    <i class="{{ item.icon }}"></i>{{ item.label }}
                </a>
                <button *ngIf="(!item.access || item.access.indexOf(access.role) > -1) && !item.link" [ngClass]="{ 'nav__link-active' : menuselected == item.name }" class="nav__link">
                    <i class="{{ item.icon }}"></i><span>{{ item.label }}</span><i class="fas fa-plus"></i>
                </button>
                <ul *ngIf="(!item.access || item.access.indexOf(access.role) > -1) && item.subs && item.subs.length > 0" class="nav__dropdown">
                    <span *ngFor="let sub of item.subs">
                        <li *ngIf="!sub.access || sub.access.indexOf(access.role) > -1" class="nav__subitem">
                            <a [ngClass]="{ 'nav__sublink-active' : menuselected == item.name && pageselected == sub.name }" (click)="redirect(sub.link, item.name, sub.name)" class="nav__sublink">- {{ sub.label }}</a>
                        </li>
                    </span>
                </ul>
            </li>
        </ul>
    </div>
    <div class="nav__xene">
        <div class="xenelogo">
            <img src="./assets/img/xenelogo.png" alt="">
        </div>
    </div>
</nav>
