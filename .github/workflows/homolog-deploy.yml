# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Deploy Homolog

on:
  push:
    branches: [ "homolog" ]

jobs:
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Stop and clean backend
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        script: |
          forever stop ${{ secrets.HOM_FOREVER_ID }} || echo "Forever cannot find process"
          cd /root/.forever/ && rm ${{ secrets.HOM_FOREVER_ID }}.log
          cd ${{ secrets.ROOT_BACKEND }}homolog/oilgroup/
          cd backend/
          rm config.env
          rm -rf node_modules/
          echo "REMOVE ENV FILE AND NODE MODULES SUCCESSFUL"

    - name: Update backend
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        script: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion
          cd ${{ secrets.ROOT_BACKEND }}homolog/oilgroup/
          git checkout .
          git checkout homolog
          git pull ${{ secrets.PROYECT_URL }}
          cd backend/
          npm install

    - name: Create env file
      run: |
        touch config.env
        echo "${{ secrets.HOM_ENV_FILE }}" >> config.env
        cat config.env
        echo "CREATE ENV FILE SUCCESSFUL"

    - name: Upload env file
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        source: config.env
        target: ${{ secrets.ROOT_BACKEND }}homolog/oilgroup/backend/

    - name: Restart backend
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        script: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion
          cd ${{ secrets.ROOT_BACKEND }}homolog/oilgroup/
          cd backend/
          npm run build-hom
          echo "UPDATE AND RESTART HOMOLOG BACKEND SUCCESSFUL"

  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: cd frontend && npm install

    - name: Build front
      run: cd frontend && npm run build-hom

    - name: Upload front
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        source: frontend/dist/
        target: ${{ secrets.ROOT_TEMP }}/homolog/oilgroup/

    - name: Restart front
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        script: |
          rm -rf ${{ secrets.ROOT_DOMAIN }}homolog/
          cp -r ${{ secrets.ROOT_TEMP }}/homolog/oilgroup/frontend/dist/ ${{ secrets.ROOT_DOMAIN }}homolog/
          rm -rf ${{ secrets.ROOT_TEMP }}/homolog/oilgroup/
          echo "UPDATE AND RESTART HOMOLOG FRONTEND SUCCESSFUL"
