# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "development" ]

jobs:
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: cd backend && npm install

    - name: Create env file
      run: |
        cd backend
        touch config.env
        echo "${{ secrets.HOM_ENV_FILE }}" >> config.env
        cat config.env
        echo "CREATE ENV FILE SUCCESSFUL"

    - name: Stop and clean backend
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        script: |
          forever stop ${{ secrets.DEV_FOREVER_ID }} || echo "Forever cannot find process"
          cd /root/.forever/ && rm ${{ secrets.HOM_FOREVER_ID }}.log
          cd ${{ secrets.ROOT_BACKEND }}development/oilgroup/
          rm -rf backend/
          echo "REMOVE ENV FILE AND NODE MODULES SUCCESSFUL"

    - name: Upload back
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        source: backend/
        target: ${{ secrets.ROOT_BACKEND }}development/oilgroup/

    - name: Restart backend
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PASSWORD }}
        port: ${{ secrets.HOST_PORT }}
        script: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion
          cd ${{ secrets.ROOT_BACKEND }}development/oilgroup/
          cd backend/
          npm run build-dev
          echo "UPDATE AND RESTART HOMOLOG BACKEND SUCCESSFUL"
