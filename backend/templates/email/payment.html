<!DOCTYPE html>

<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:v="urn:schemas-microsoft-com:vml">

<head>
    <title></title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: whitesmoke;
            margin: 0;
            padding: 50px 0;
            text-size-adjust: none;
            -webkit-text-size-adjust: none;
        }

        .container {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        .box {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
            width: 100%;
        }

        .content {
            color: #000000;
            margin: auto;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
            width: 600px;
        }

        .content-main {
            background-color: white;
            border: 1px solid lightgrey;
            border-radius: 15px;
        }

        .column {
            border: none;
            font-weight: 400;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
            padding: 15px 50px;
            text-align: left;
            vertical-align: top;
            width: 100%;
        }

        .row {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
            width: 100%;
            word-break: break-word;
        }

        .text {
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.2;
            mso-line-height-alt: 16.8px;
        }

        .text p {
            color: #40507a;
            font-size: 16px;
            margin: 0;
            mso-line-height-alt: 16.8px;
        }

        .text h1 {
            color: #D74850;
            font-size: 38px;
        }

        .image {
            text-align: center;
        }

        .logo {
            line-height: 10px;
            margin: auto;
            width: 145px;
        }

        .logo a {
            outline: none;
        }

        .logo a img {
            border: 0;
            display: block;
            height: auto;
            max-width: 100%;
            width: 145px;
        }

        a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: inherit !important;
        }

        p {
            line-height: inherit
        }

        .image_block img+div {
            display: none;
        }

        @media (max-width:620px) {

            .image_block img.big,
            .row-content {
                width: 100% !important;
            }

            .stack .column {
                width: 100%;
                display: block;
            }
        }
    </style>
</head>

<body>
    {{ENVIRONMENT}}
    <table cellpadding="0" cellspacing="0" class="container" role="presentation" width="100%">
        <tbody>
            <tr>
                <td>
                    <table cellpadding="0" cellspacing="0" class="box" role="presentation">
                        <tbody>
                            <tr>
                                <td>
                                    <table cellpadding="0" cellspacing="0" class="content content-main" role="presentation">
                                        <tbody>
                                            <tr>
                                                <td class="column">
                                                    <table cellpadding="10" cellspacing="0" class="row" role="presentation">
                                                        <tr>
                                                            <td>
                                                                <div>
                                                                    <div class="text">
                                                                        <h1>
                                                                            <span>Comprobante de pago</span>
                                                                        </h1>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                    <table cellpadding="10" cellspacing="0" class="row" role="presentation">
                                                        <tr>
                                                            <td>
                                                                <div>
                                                                    <div class="text">
                                                                        <p>
                                                                            <span>Se registro un nuevo comprobante de pago correspondiente a la cuota de {{PAYMENT-MONTH}}</span>
                                                                        </p>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                    <table cellpadding="10" cellspacing="0" class="row" role="presentation">
                                                        <tr>
                                                            <td>
                                                                <div>
                                                                    <div class="image">
                                                                        <img width="300" src="{{PAYMENT-IMAGE}}" alt="Comprobante">
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <table cellpadding="0" cellspacing="0" class="box" role="presentation">
                        <tbody>
                            <tr>
                                <td>
                                    <table cellpadding="0" cellspacing="0" class="content" role="presentation">
                                        <tbody>
                                            <tr>
                                                <td class="column">
                                                    <table cellpadding="10" cellspacing="0" class="row" role="presentation">
                                                        <tr>
                                                            <td>
                                                                <div class="logo">
                                                                    <a href="https://oilgroup.com.ar/" tabindex="-1" target="_blank">
                                                                        <img alt="Your Logo" src="https://res.cloudinary.com/octo-mode/image/upload/v1681951247/oilgroup/logo_u42sgn.png" />
                                                                    </a>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
