<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Ventas/Compras</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 8px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th {
            background: lightgray;
        }

        td {
            padding: 5px;
            vertical-align: top;
        }
    </style>
</head>

<body>
    <img style="width: 40%;" src="{{IMAGES_FOLDER}}logo.png">
    <br>
    <div>
        <h1 style="font-size: 15px;padding: 5px;text-align: center;">VENTAS/COMPRAS</h1>
        <table>
            <tr>
                <td style="white-space: pre;"><strong>Desde:</strong> {{FROM}}</td>
                <td style="white-space: pre;"><strong>Hasta:</strong> {{TO}}</td>
            </tr>
        </table>
    </div>
    <br>
    <div style="border: 1px solid;">
        <table>
            <tr>
                <td style="white-space: pre;"><strong>Usuario:</strong></td>
                <td style="white-space: pre;">{{USER}}</td>
            </tr>
            <tr>
                <td style="white-space: pre;"><strong>Fecha:</strong></td>
                <td style="white-space: pre;">{{DATETIME}}</td>
            </tr>
        </table>
    </div>
    <br>
    <div>
        <table style="border: 1px solid;height: 100%;">
            <tr>
                <th style="border: 1px solid;width: 80px;">Fecha</th>
                <th style="border: 1px solid;">Cliente/Proveedor</th>
                <th style="border: 1px solid;width: 80px;">Total</th>
            </tr>
            {{ITEMS}}
        </table>
    </div>
</body>

</html>
