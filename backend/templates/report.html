<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title></title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 12px;
        }

        h1 {
            font-size: 18px;
            padding: 5px;
        }

        table {
            border-collapse: collapse;
            font-size: 10px;
            width: 100%;
        }

        th {
            background: lightgray;
            padding: 10px 5px;
        }

        th:first-child {
            border-bottom-left-radius: 5px;
            border-top-left-radius: 5px;
        }

        th:last-child {
            border-bottom-right-radius: 5px;
            border-top-right-radius: 5px;
        }

        tr {
            page-break-before: always;
            page-break-inside: avoid;
        }

        tr:nth-child(odd) {
            background: whitesmoke;
        }

        td {
            padding: 10px 5px;
            vertical-align: top;
            white-space: pre;
        }

        .box {
            background: whitesmoke;
            border: 1px solid lightgrey;
            border-radius: 5px;
            margin-bottom: 15px;
            padding: 10px;
        }

    </style>
</head>

</html>
